name: HFT Engine Tests
on:
  push:
    branches: ["main", "feature/hft-ai-engine"]
  pull_request:

jobs:
  test-hft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q backend/tests/test_hft_engine.py
