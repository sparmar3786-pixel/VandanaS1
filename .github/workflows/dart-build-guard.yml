name: Dart Build Guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dart-build-guard.yml'
      - 'flutter_app/**'
      - 'flutter_app/pubspec.yaml'
      - 'flutter_app/pubspec.lock'
  pull_request:
    paths:
      - 'flutter_app/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

concurrency:
  group: vandana1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dart-guard:
    name: Dart Build Guard (Vandana1 #355 baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Vandana1 #355 project structure
        run: |
          test -d flutter_app
          test -f flutter_app/pubspec.yaml
          echo "Vandana1 #355 baseline structure detected."

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Report Dart and Flutter versions
        working-directory: flutter_app
        run: |
          flutter --version
          dart --version

      - name: Generate Android platform for compile verification
        working-directory: flutter_app
        run: |
          flutter create . --platforms=android --project-name parmar_trading --org com.parmar

      - name: Remove generated sample test
        working-directory: flutter_app
        run: rm -f test/widget_test.dart

      - name: Clean Flutter build artifacts
        working-directory: flutter_app
        run: flutter clean

      - name: Get dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Check dependency lockfile
        working-directory: flutter_app
        run: |
          test -f pubspec.lock
          flutter pub deps --style=compact

      - name: Format Dart source before validation
        working-directory: flutter_app
        run: |
          dart format lib
          dart format --output=none --set-exit-if-changed lib
          git diff --check


      - name: Analyze Dart source
        working-directory: flutter_app
        run: |
          set +e
          flutter analyze --no-fatal-warnings 2>&1 | tee flutter-analyze.log
          rc=${PIPESTATUS[0]}
          if grep -qE '^ *error •' flutter-analyze.log; then
            echo 'Dart/Flutter analyzer found real errors.'
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "Analyzer returned $rc but reported no error-level diagnostics; continuing."
          fi

      - name: Run Flutter tests
        working-directory: flutter_app
        run: |
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo "No Flutter test files found; test stage skipped."
          fi

      - name: Verify Dart compile
        working-directory: flutter_app
        run: |
          flutter build apk --debug --no-pub

      - name: Upload guard diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dart-build-guard-diagnostics
          path: |
            flutter_app/flutter-analyze.log
            flutter_app/.dart_tool/package_config.json
          if-no-files-found: ignore
